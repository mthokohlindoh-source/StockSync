<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSync - Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.tailwindcss.com"></script>
<script>
// SECURITY: Block direct access + Block back button after logout
const saved = sessionStorage.getItem('stocksync_user');
if(!saved){ window.location.replace('index.html'); }
const user = saved ? JSON.parse(saved) : null;
// Auto logout after 30 mins
if(user && Date.now() - user.loginTime > 30*60*1000){ sessionStorage.removeItem('stocksync_user'); window.location.replace('index.html'); }
history.pushState(null, null, location.href);
window.onpopstate = function(){ history.pushState(null, null, location.href); };
</script>
</head>
<body class="bg-slate-100 min-h-screen">
<header class="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-10">
  <div><h1 class="font-black text-xl">📦 StockSync</h1><p id="welcome" class="text-xs text-slate-300"></p></div>
  <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg font-bold text-sm">Logout</button>
</header>

<main class="p-4 max-w-3xl mx-auto pb-24">
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="bg-white p-3 rounded-xl text-center"><p class="text-xs text-slate-500">Total Items</p><p id="totalItems" class="text-2xl font-black">0</p></div>
    <div class="bg-white p-3 rounded-xl text-center"><p class="text-xs text-slate-500">Total Qty</p><p id="totalQty" class="text-2xl font-black">0</p></div>
    <div class="bg-white p-3 rounded-xl text-center"><p class="text-xs text-slate-500">Low Stock</p><p id="lowStock" class="text-2xl font-black text-red-500">0</p></div>
  </div>

  <input id="search" oninput="render()" placeholder="🔍 Search product..." class="w-full p-3 rounded-xl border mb-4 outline-none">

  <div id="adminBox" class="bg-white p-4 rounded-2xl shadow mb-4">
    <h2 class="font-bold mb-3">➕ Add Product</h2>
    <input id="pName" placeholder="Product name" class="w-full border rounded-xl p-3 mb-2">
    <div class="flex gap-2">
      <input id="pQty" type="number" placeholder="Qty" class="flex-1 border rounded-xl p-3">
      <input id="pPrice" type="number" placeholder="Price R" class="flex-1 border rounded-xl p-3">
    </div>
    <button onclick="addProduct()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl mt-3">Add Product</button>
  </div>

  <div id="viewerMsg" class="hidden bg-amber-100 border border-amber-300 text-amber-800 p-3 rounded-xl text-sm mb-4">👀 You are a Viewer — you can only view stock. Ask Admin to add products.</div>

  <div id="list" class="space-y-3"></div>
</main>

<script>
let products = JSON.parse(localStorage.getItem('stocksync_products') || '[]');
document.getElementById('welcome').textContent = `Hi ${user.name} • ${user.role}`;
if(user.role !== 'Admin'){
  document.getElementById('adminBox').style.display='none';
  document.getElementById('viewerMsg').classList.remove('hidden');
}
function save(){ localStorage.setItem('stocksync_products', JSON.stringify(products)); render(); }
function addProduct(){
  if(user.role!=='Admin') return alert('Viewers cannot add products');
  const name=document.getElementById('pName').value.trim();
  const qty=parseInt(document.getElementById('pQty').value);
  const price=parseFloat(document.getElementById('pPrice').value)||0;
  if(!name || isNaN(qty)) return alert('Enter name and qty');
  products.push({id:Date.now(), name, qty, price});
  document.getElementById('pName').value=''; document.getElementById('pQty').value=''; document.getElementById('pPrice').value='';
  save();
}
function del(id){ if(user.role!=='Admin') return; if(confirm('Delete this product?')){ products=products.filter(p=>p.id!==id); save(); } }
function changeQty(id, amount){ if(user.role!=='Admin') return; const p=products.find(x=>x.id===id); p.qty=Math.max(0,p.qty+amount); save(); }
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=products.filter(p=>p.name.toLowerCase().includes(q));
  document.getElementById('totalItems').textContent=products.length;
  document.getElementById('totalQty').textContent=products.reduce((a,b)=>a+b.qty,0);
  document.getElementById('lowStock').textContent=products.filter(p=>p.qty<5).length;
  document.getElementById('list').innerHTML = filtered.length? '' : '<p class="text-center text-slate-400 py-8">No products yet. Add one above.</p>';
  filtered.forEach(p=>{
    const div=document.createElement('div');
    div.className='bg-white p-4 rounded-2xl shadow flex justify-between items-center';
    div.innerHTML=`
      <div><p class="font-bold">${p.name}</p><p class="text-sm text-slate-500">R ${p.price.toFixed(2)} • ${p.qty<5?'⚠️ Low Stock':p.qty+' in stock'}</p></div>
      <div class="flex items-center gap-2">
        ${user.role==='Admin'?`<button onclick="changeQty(${p.id},-1)" class="bg-slate-200 w-8 h-8 rounded-full font-bold">-</button><span class="font-black w-8 text-center">${p.qty}</span><button onclick="changeQty(${p.id},1)" class="bg-slate-200 w-8 h-8 rounded-full font-bold">+</button><button onclick="del(${p.id})" class="text-red-500 font-bold ml-1">🗑️</button>`:`<span class="font-black bg-slate-100 px-3 py-1 rounded-full">${p.qty}</span>`}
      </div>`;
    document.getElementById('list').appendChild(div);
  });
}
function logout(){
  sessionStorage.removeItem('stocksync_user');
  sessionStorage.clear();
  window.location.replace('index.html');
}
render();
</script>
</body>
</html>
