<style>
body { background: #f1f5f9; text-align: center; padding-top: 40px; font-family: Arial; }
.box { background: white; width: 300px; margin: auto; padding: 20px; border-radius: 16px; }
h2 { margin: 0; }
p { color: grey; font-size: 14px; }
input, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid #ccc; }
button { width: 100%; padding: 12px; margin-top: 12px; background: black; color: white; border-radius: 10px; font-size: 16px; }
.badge { background: green; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; }
</style>

<div class="box">
<span class="badge">● ONLINE</span>
<h2>StockSync Login</h2>
<p>Choose your role to test</p>

<input placeholder="Enter your name">
<select>
<option>Admin</option>
<option>Staff</option>
<option>Viewer</option>
</select>

<button>Login</button>
<p>Admin can do everything. Viewer can only view.</p>
</div>
<script>
if (!navigator.onLine) {
  document.querySelector('.badge').textContent = '● OFFLINE';
  document.querySelector('.badge').style.background = '#ff0000';
}
</script>
