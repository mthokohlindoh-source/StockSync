<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSync - Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
  <link rel="icon" href="Icon .jpg">
<link rel="apple-touch-icon" href="Icon .jpg">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl">
  <div class="text-center mb-6">
    <div class="text-5xl">📦</div>
    <h1 class="text-3xl font-black mt-2">StockSync</h1>
    <p class="text-slate-500 text-sm">Manage your stock. Anywhere.</p>
  </div>
  <label class="text-sm font-bold">Your Name</label>
  <input id="name" type="text" placeholder="e.g. Thabo" class="w-full border rounded-xl p-3 mt-1 mb-4 outline-none focus:border-blue-500">
  <label class="text-sm font-bold">Role</label>
  <select id="role" class="w-full border rounded-xl p-3 mt-1 mb-4">
    <option value="Admin">Admin - Can Add / Edit / Delete</option>
    <option value="Viewer">Viewer - View Only</option>
  </select>
  <label class="text-sm font-bold">Admin Password <span class="font-normal text-slate-400">(Only for Admin)</span></label>
  <input id="password" type="password" placeholder="Admin password" class="w-full border rounded-xl p-3 mt-1 mb-4 outline-none focus:border-blue-500">
  <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">Login →</button>
  <p id="error" class="text-red-500 text-sm text-center mt-3 hidden"></p>
  <p class="text-center text-xs text-slate-400 mt-4">Default Admin password: <b>admin123</b></p>
</div>
<script>
function login(){
  const name = document.getElementById('name').value.trim();
  const role = document.getElementById('role').value;
  const pass = document.getElementById('password').value;
  const err = document.getElementById('error');
  if(!name){ err.textContent="Please enter your name"; err.classList.remove('hidden'); return; }
  const savedPass = localStorage.getItem('stocksync_admin_pass') || "admin123";
  if(role==="Admin" && pass!==savedPass){
    err.textContent="Wrong Admin password! Try: " + savedPass; err.classList.remove('hidden'); return;
  }
  const user = { name, role, loginTime: Date.now() };
  sessionStorage.setItem('stocksync_user', JSON.stringify(user));
  window.location.replace('dashboard.html');
}
</script>
</body>
</html>
