<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSync - Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-sm rounded-[28px] p-6 shadow-2xl">
  <div class="flex flex-col items-center">
    <img src="logo.png" class="w-20 h-20 rounded-2xl object-cover bg-slate-100 p-1" onerror="this.style.display='none'">
    <h1 class="text-3xl font-black mt-3">StockSync</h1>
    <p class="text-slate-400 text-sm">Manage your shop smartly</p>
  </div>
  <div class="mt-6">
    <label class="text-sm font-bold">Your Name</label>
    <input id="name" placeholder="e.g. Mthokozisi" class="w-full border rounded-xl p-3.5 mt-1 mb-3 outline-none focus:border-blue-600">
    <label class="text-sm font-bold">Role</label>
    <select id="role" class="w-full border rounded-xl p-3.5 mt-1 mb-3 bg-white"><option>Admin</option><option>Viewer</option><option>Cashier</option></select>
    <label class="text-sm font-bold">Password</label>
    <input id="pass" type="password" placeholder="Enter password" class="w-full border rounded-xl p-3.5 mt-1 mb-1 outline-none focus:border-blue-600">
    <p class="text-xs text-slate-400 mb-3">Default: Admin = admin123 | Viewer = view123 | Cashier = cash123 — change in Settings</p>
    <button onclick="login()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl">Login →</button>
    <p id="err" class="text-red-500 text-sm font-bold text-center mt-3 hidden">Wrong password. Try again.</p>
  </div>
  <p class="text-center text-xs text-slate-400 mt-5">Tip: Tap ☰ in dashboard for Sales, Settings, Staff</p>
</div>
<script>
function getUsers(){
  let u = JSON.parse(localStorage.getItem('stocksync_users') || 'null');
  if(!u){
    u = [
      {name:'Thabo', role:'Admin', pass:'admin123'},
      {name:'Viewer', role:'Viewer', pass:'view123'},
      {name:'Cashier', role:'Cashier', pass:'cash123'}
    ];
    localStorage.setItem('stocksync_users', JSON.stringify(u));
  }
  return u;
}
function login(){
  const name = document.getElementById('name').value.trim();
  const role = document.getElementById('role').value;
  const pass = document.getElementById('pass').value.trim();
  if(!name || !pass){ alert('Enter name and password'); return; }
  const users = getUsers();
  // Find user by role + password, allow any name typed if password matches role (so you can use your own name)
  const match = users.find(x=>x.role===role && x.pass===pass);
  if(!match){ document.getElementById('err').classList.remove('hidden'); return; }
  sessionStorage.setItem('stocksync_user', JSON.stringify({name:name, role:role, loginTime:Date.now()}));
  window.location.href='dashboard.html';
}
document.getElementById('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
